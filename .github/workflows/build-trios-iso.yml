name: Build TriOS Live ISO

on:
  workflow_dispatch:      # ручной запуск кнопкой
  push:
    branches: [main]

permissions:
  contents: write         # нужно для создания Release

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate TriOS build kit
        env:
          KIT_B64_1: ""
          KIT_B64_2: ""
          KIT_B64_3: ""
          KIT_B64_4: ""
          KIT_B64_5: ""
        run: |
          : > kit.b64
          for chunk in "$KIT_B64_1" "$KIT_B64_2" "$KIT_B64_3" "$KIT_B64_4" "$KIT_B64_5"; do
            echo "$chunk" >> kit.b64
          done
          base64 -d kit.b64 | tar -xz
          chmod +x auto/config auto/build auto/clean build.sh
          chmod +x config/hooks/*.chroot 2>/dev/null || true
          chmod +x config/includes.chroot/usr/local/bin/trios-session \
                  config/includes.chroot/usr/local/bin/install.sh \
                  config/includes.chroot/usr/local/bin/trios-launcher.py
          echo "== kit unpacked =="
          ls -l config/includes.chroot/usr/local/bin/
          test -f live-build_20250505+deb13u1_all.deb && echo "live-build deb OK"
          test -f RELEASE-README.txt && echo "release readme OK"
          grep -q 'mirror-bootstrap "http://deb.debian.org' auto/config && echo "mirrors OK"
          grep -q 'linux-packages "linux-image"' auto/config && echo "kernel OK"
          grep -q 'trios:trios' config/hooks/0110-user.chroot && echo "user hook OK"
          grep -q 'WLR_RENDERER=pixman' config/includes.chroot/usr/local/bin/trios-session && echo "renderer fallback OK"
          grep -q 'waydroid' config/package-lists/trios.list.chroot && echo "waydroid pkg OK"
          grep -q waybar config/includes.chroot/etc/skel/.config/labwc/autostart && echo "autostart OK"
          test -f config/includes.chroot/etc/xdg/waybar/config && echo "waybar OK"
          test -f config/includes.chroot/usr/local/share/trios/dosbox.conf && echo "dosbox conf OK"
          grep -q 'fullscreen' config/includes.chroot/usr/local/bin/trios-launcher.py && echo "fullscreen OK"
          grep -q 'not_initialized' config/includes.chroot/usr/local/bin/trios-launcher.py && echo "waydroid status OK"
          grep -q waydroid config/hooks/0120-waydroid.chroot && echo "waydroid hook OK"
          python3 -c "import ast;ast.parse(open('config/includes.chroot/usr/local/bin/trios-launcher.py').read())" && echo "launcher syntax OK"
          grep -q 'fg=FG).pack(fill="x", padx=22, pady=(18, 2))' config/includes.chroot/usr/local/bin/trios-launcher.py && echo "launcher fix OK"
          test -f config/includes.chroot/etc/xdg/labwc/rc.xml && echo "rc.xml OK"
          grep -q 'name="Fullscreen"' config/includes.chroot/etc/xdg/labwc/rc.xml && echo "kiosk fullscreen OK"
          grep -q 'A-F4' config/includes.chroot/etc/xdg/labwc/rc.xml && echo "altf4 disabled OK"
          grep -q 'systemctl poweroff' config/includes.chroot/etc/xdg/labwc/menu.xml && echo "kiosk menu OK"
          ! grep -q Escape config/includes.chroot/usr/local/bin/trios-launcher.py && echo "no-escape OK"
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools \
                                  xorriso dosfstools debian-archive-keyring
          # Заменяем убунтовский live-build (3.0~a57, ветка 2012 г.) на актуальный из Debian trixie
          sudo dpkg -i live-build_20250505+deb13u1_all.deb
          echo "=== live-build теперь такой: ==="
          lb --version

      - name: Configure live-build
        run: sh auto/config

      - name: Build ISO
        run: |
          sudo bash auto/build
          ISO=$(ls -1t *.iso | head -n1)
          test -n "$ISO" && mv "$ISO" trios-live-amd64.iso
          ls -lh trios-live-amd64.iso

          # Нарезка на части по 500 МБ — для надёжного скачивания при обрывах
          sha256sum trios-live-amd64.iso > sha256.txt
          split -b 500m -d -a 2 trios-live-amd64.iso trios-live-amd64.iso.part
          ls -lh trios-live-amd64.iso*

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "=== версия live-build ==="
          lb --version 2>/dev/null || dpkg -l live-build | tail -1
          echo "=== строки ошибок apt из build.log ==="
          grep -nE "^(E:|Err:)" build.log 2>/dev/null | tail -n 30 || echo "(строк E:/Err: нет)"
          echo "=== build.log: последние 120 строк ==="
          tail -n 120 build.log 2>/dev/null || true
          echo "=== ресурсы раннера ==="
          df -h / 2>/dev/null || true
          free -m 2>/dev/null || true
          echo "=== файлы репозитория ==="
          ls -la

      - name: Upload ISO (artifact)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: trios-live-iso
          path: trios-live-amd64.iso
          compression-level: 0
          retention-days: 14

      - name: Upload ISO to Release
        if: success()
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: trios-v${{ github.run_number }}
          name: TriOS Live — сборка №${{ github.run_number }}
          body: |
            Автоматическая сборка TriOS Live ISO.
            Основа: Debian trixie + Wayland (labwc), автозапуск trios-launcher.py.
            Режимы: DOS (DOSBox), Windows (Wine), Android (Waydroid).
            Если скачивание ISO обрывается — скачайте части part00, part01, ... из этого же релиза,
            соберите их в один файл (cat trios-live-amd64.iso.part* > trios-live-amd64.iso)
            и проверьте целостность (sha256sum -c sha256.txt).
          files: |
            trios-live-amd64.iso
            trios-live-amd64.iso.part*
            sha256.txt
            RELEASE-README.txt
          fail_on_unmatched_files: true
