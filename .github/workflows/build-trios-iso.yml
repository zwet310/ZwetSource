name: Build TriOS Live ISO

on:
  workflow_dispatch:      # ручной запуск кнопкой
  push:
    branches: [main]

permissions:
  contents: write         # нужно для создания Release

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate TriOS build kit
        env:
          KIT_B64_1: ""
          KIT_B64_2: ""
          KIT_B64_3: ""
          KIT_B64_4: ""
          KIT_B64_5: ""
        run: |
          : > kit.b64
          for chunk in "$KIT_B64_1" "$KIT_B64_2" "$KIT_B64_3" "$KIT_B64_4" "$KIT_B64_5"; do
            echo "$chunk" >> kit.b64
          done
          base64 -d kit.b64 | tar -xz
          chmod +x auto/config auto/build auto/clean build.sh
          chmod +x config/hooks/*.chroot 2>/dev/null || true
          echo "== kit unpacked =="
          ls auto config config/hooks config/package-lists
          test -f live-build_20250505+deb13u1_all.deb && echo "live-build deb OK"
          grep -q 'mirror-bootstrap "http://deb.debian.org' auto/config && echo "mirrors OK"
          grep -q 'linux-packages "linux-image"' auto/config && echo "kernel OK"
          grep -q '^trios' config/hooks/0110-user.chroot && echo "user hook OK"
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools \
                                  xorriso dosfstools debian-archive-keyring
          # Заменяем убунтовский live-build (3.0~a57, ветка 2012 г.) на актуальный из Debian trixie
          sudo dpkg -i live-build_20250505+deb13u1_all.deb
          echo "=== live-build теперь такой: ==="
          lb --version

      - name: Configure live-build
        run: sh auto/config

      - name: Build ISO
        run: |
          sudo bash auto/build
          ISO=$(ls -1t *.iso | head -n1)
          test -n "$ISO" && mv "$ISO" trios-live-amd64.iso
          ls -lh trios-live-amd64.iso

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "=== версия live-build ==="
          lb --version 2>/dev/null || dpkg -l live-build | tail -1
          echo "=== строки ошибок apt из build.log ==="
          grep -nE "^(E:|Err:)" build.log 2>/dev/null | tail -n 30 || echo "(строк E:/Err: нет)"
          echo "=== build.log: последние 120 строк ==="
          tail -n 120 build.log 2>/dev/null || true
          echo "=== ресурсы раннера ==="
          df -h / 2>/dev/null || true
          free -m 2>/dev/null || true
          echo "=== файлы репозитория ==="
          ls -la

      - name: Upload ISO (artifact)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: trios-live-iso
          path: trios-live-amd64.iso
          compression-level: 0
          retention-days: 14

      - name: Upload ISO to Release
        if: success()
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: trios-v${{ github.run_number }}
          name: TriOS Live — сборка №${{ github.run_number }}
          body: |
            Автоматическая сборка TriOS Live ISO.
            Основа: Debian trixie + Wayland (labwc), автозапуск trios-launcher.py.
            Режимы: DOS (DOSBox), Windows (Wine), Android (Waydroid).
          files: trios-live-amd64.iso
          fail_on_unmatched_files: true
