name: Build TriOS Live ISO

on:
  workflow_dispatch:      # ручной запуск кнопкой
  push:
    branches: [main]

permissions:
  contents: write         # нужно для создания Release

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate TriOS build kit
        env:
          KIT_B64_1: ""
          KIT_B64_2: ""
          KIT_B64_3: ""
          KIT_B64_4: ""
          KIT_B64_5: ""
        run: |
          : > kit.b64
          for chunk in "$KIT_B64_1" "$KIT_B64_2" "$KIT_B64_3" "$KIT_B64_4" "$KIT_B64_5"; do
            echo "$chunk" >> kit.b64
          done
          base64 -d kit.b64 | tar -xz
          chmod +x auto/config auto/build auto/clean build.sh
          find config/hooks -type f -name '*.chroot' -exec chmod +x {} \;
          chmod +x config/includes.chroot/usr/local/bin/trios-session \
                  config/includes.chroot/usr/local/bin/install.sh \
                  config/includes.chroot/usr/local/bin/trios-launcher.py
          echo "== kit unpacked =="
          ls -l config/includes.chroot/usr/local/bin/
          test -f live-build_20250505+deb13u1_all.deb && echo "live-build deb OK"
          test -f RELEASE-README.txt && echo "release readme OK"
          grep -q 'mirror-bootstrap "http://deb.debian.org' auto/config && echo "mirrors OK"
          grep -q 'linux-packages "linux-image"' auto/config && echo "kernel OK"
          grep -q 'trios:trios' config/hooks/normal/0110-user.chroot && echo "user hook OK"
          grep -q 'WLR_RENDERER=pixman' config/includes.chroot/usr/local/bin/trios-session && echo "renderer fallback OK"
          if grep -qE '^[[:space:]]*waydroid[[:space:]]*$' config/package-lists/trios.list.chroot; then echo "ОШИБКА: waydroid не должен быть в списке пакетов (его ставит хук 0100)"; exit 1; fi
          echo "waydroid pkg list OK (вне списка)"
          grep -q waybar config/includes.chroot/etc/skel/.config/labwc/autostart && echo "autostart OK"
          test -f config/includes.chroot/etc/xdg/waybar/config && echo "waybar OK"
          test -f config/includes.chroot/usr/local/share/trios/dosbox.conf && echo "dosbox conf OK"
          grep -q 'fullscreen' config/includes.chroot/usr/local/bin/trios-launcher.py && echo "fullscreen OK"
          grep -q 'not_initialized' config/includes.chroot/usr/local/bin/trios-launcher.py && echo "waydroid status OK"
          grep -q waydroid config/hooks/normal/0120-waydroid.chroot && echo "waydroid hook OK"
          python3 -c "import ast;ast.parse(open('config/includes.chroot/usr/local/bin/trios-launcher.py').read())" && echo "launcher syntax OK"
          grep -q 'fg=FG).pack(fill="x", padx=22, pady=(18, 2))' config/includes.chroot/usr/local/bin/trios-launcher.py && echo "launcher fix OK"
          test -f config/includes.chroot/etc/xdg/labwc/rc.xml && echo "rc.xml OK"
          grep -q 'name="Fullscreen"' config/includes.chroot/etc/xdg/labwc/rc.xml && echo "kiosk fullscreen OK"
          grep -q 'A-F4' config/includes.chroot/etc/xdg/labwc/rc.xml && echo "altf4 disabled OK"
          grep -q 'systemctl poweroff' config/includes.chroot/etc/xdg/labwc/menu.xml && echo "kiosk menu OK"
          ! grep -q Escape config/includes.chroot/usr/local/bin/trios-launcher.py && echo "no-escape OK"
          grep -q 'repo.waydro.id/waydroid.gpg' config/hooks/normal/0100-waydroid.chroot && echo "waydroid repo OK"
          test -d config/hooks/normal && echo "hooks normal OK"
          [ -z "$(ls config/hooks/*.chroot 2>/dev/null)" ] && echo "flat hooks empty OK"
          grep -q 'wine-gecko-2.47.4' config/hooks/normal/0130-wine-gecko.chroot && echo "gecko hook OK"
          grep -q 'repo.waydro.id' config/includes.chroot/usr/local/bin/install.sh && echo "install.sh waydroid OK"
          grep -q 'fullscreen=false' config/includes.chroot/usr/local/share/trios/dosbox.conf && echo "dosbox windowed OK"
          grep -q 'raiseOnFocus' config/includes.chroot/etc/xdg/labwc/rc.xml && echo "raiseOnFocus OK"
          echo "=== pre-flight: проверка пакетов из списка в trixie ==="
          : > /tmp/packages.txt
          for area in main contrib non-free non-free-firmware; do
            curl -fsSL --max-time 60 "http://deb.debian.org/debian/dists/trixie/$area/binary-amd64/Packages.gz" | zcat >> /tmp/packages.txt || echo "(область $area недоступна, пропускаю)"
          done
          if [ ! -s /tmp/packages.txt ]; then
            echo "Индексы trixie скачать не удалось — pre-flight пропущен"
          else
            grep -hE '^Package: ' /tmp/packages.txt | sed 's/^Package: //' | sort -u > /tmp/available.txt
            grep -hvE '^[[:space:]]*(#|$)' config/package-lists/*.list.chroot | tr -d ' \t' | sort -u > /tmp/wanted.txt
            MISSING=$(comm -23 /tmp/wanted.txt /tmp/available.txt)
            if [ -n "$MISSING" ]; then
              echo "ПАКЕТЫ ОТСУТСТВУЮТ В trixie (сборка упадёт на apt install):"
              echo "$MISSING"
              exit 1
            fi
            echo "pre-flight OK: все $(wc -l < /tmp/wanted.txt) пакетов из списка есть в trixie"
          fi
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools \
                                  xorriso dosfstools debian-archive-keyring
          # Заменяем убунтовский live-build (3.0~a57, ветка 2012 г.) на актуальный из Debian trixie
          sudo dpkg -i live-build_20250505+deb13u1_all.deb
          echo "=== live-build теперь такой: ==="
          lb --version

      - name: Configure live-build
        run: sh auto/config

      - name: Build ISO
        run: |
          sudo bash auto/build
          ISO=$(ls -1t *.iso | head -n1)
          test -n "$ISO" && mv "$ISO" trios-live-amd64.iso
          ls -lh trios-live-amd64.iso

          # Нарезка на части по 500 МБ — для надёжного скачивания при обрывах
          sha256sum trios-live-amd64.iso > sha256.txt
          split -b 500m -d -a 2 trios-live-amd64.iso trios-live-amd64.iso.part
          ls -lh trios-live-amd64.iso*

      - name: Verify preinstalled packages
        run: |
          set -e
          echo "=== Проверка предустановленных пакетов (по содержимому ISO) ==="
          if [ -f chroot/usr/local/share/trios/waydroid-setup.log ]; then
            echo "--- waydroid-setup.log из chroot (последние 40 строк) ---"
            tail -n 40 chroot/usr/local/share/trios/waydroid-setup.log || true
          else
            echo "(waydroid-setup.log из chroot недоступен)"
          fi
          mkdir -p /tmp/livex
          xorriso -osirrox on -indev trios-live-amd64.iso -extract /live /tmp/livex > /dev/null 2>&1 || true
          SQ=$(ls /tmp/livex/*.squashfs 2>/dev/null | head -n1)
          if [ -z "$SQ" ]; then
            echo "squashfs в ISO не найден"; ls -R /tmp/livex | head; exit 1
          fi
          echo "squashfs: $SQ"
          sudo unsquashfs -l "$SQ" > /tmp/sq_list.txt || true
          fail=0
          for p in usr/bin/waydroid usr/bin/wine usr/bin/dosbox; do
            if grep -qE "/$p\$" /tmp/sq_list.txt; then echo "$p: OK"; else echo "$p: ОТСУТСТВУЕТ"; fail=1; fi
          done
          if grep -qE '/usr/share/wine/gecko/wine-gecko-2\.47\.4.*\.msi$' /tmp/sq_list.txt; then
            echo "wine-gecko: OK"
          else
            echo "wine-gecko: не найден (не фатально)"
          fi
          if [ "$fail" -ne 0 ]; then
            echo "=== ОШИБКА: обязательные пакеты не предустановлены — Release НЕ публикуется ==="
            grep -E 'waydroid|gecko' /tmp/sq_list.txt | head -20 || true
            exit 1
          fi
          echo "Проверка предустановленных пакетов: OK"

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "=== версия live-build ==="
          lb --version 2>/dev/null || dpkg -l live-build | tail -1
          echo "=== строки ошибок apt из build.log ==="
          grep -nE "^(E:|Err:)" build.log 2>/dev/null | tail -n 30 || echo "(строк E:/Err: нет)"
          echo "=== build.log: последние 120 строк ==="
          tail -n 120 build.log 2>/dev/null || true
          echo "=== debootstrap.log: строки ошибок (реальный вывод debootstrap идёт сюда, не в build.log) ==="
          if [ -f chroot/debootstrap/debootstrap.log ]; then
            grep -nE "^(E:|W:)" chroot/debootstrap/debootstrap.log 2>/dev/null | tail -n 40
            echo "=== debootstrap.log: последние 60 строк ==="
            tail -n 60 chroot/debootstrap/debootstrap.log 2>/dev/null
            echo "=== скачано пакетов в кэш debootstrap ==="
            ls chroot/var/cache/apt/archives/*.deb 2>/dev/null | wc -l
          else
            echo "(chroot/debootstrap/debootstrap.log отсутствует — сбой до начала загрузки)"
          fi
          echo "=== OOM / убитые процессы в dmesg ==="
          sudo dmesg 2>/dev/null | grep -iE "oom|out of memory|killed process" | tail -n 20 || echo "(OOM-сообщений нет)"
          echo "=== ресурсы раннера ==="
          df -h / 2>/dev/null || true
          free -m 2>/dev/null || true
          echo "=== файлы репозитория ==="
          ls -la

      - name: Upload ISO (artifact)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: trios-live-iso
          path: trios-live-amd64.iso
          compression-level: 0
          retention-days: 14

      - name: Upload ISO to Release
        if: success()
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: trios-v${{ github.run_number }}
          name: TriOS Live — сборка №${{ github.run_number }}
          body: |
            Автоматическая сборка TriOS Live ISO.
            Основа: Debian trixie + Wayland (labwc), автозапуск trios-launcher.py.
            Режимы: DOS (DOSBox), Windows (Wine), Android (Waydroid).
            Если скачивание ISO обрывается — скачайте части part00, part01, ... из этого же релиза,
            соберите их в один файл (cat trios-live-amd64.iso.part* > trios-live-amd64.iso)
            и проверьте целостность (sha256sum -c sha256.txt).
          files: |
            trios-live-amd64.iso
            trios-live-amd64.iso.part*
            sha256.txt
            RELEASE-README.txt
          fail_on_unmatched_files: true
